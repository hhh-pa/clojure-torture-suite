name: torture

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: oracle (JVM Clojure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: harness
          save-if: "true"
      - run: make jars test check

  clojure-rs:
    name: torture (clojure-rs interp+AOT+differential+fuzz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: hhh-pa/clojure
          path: upstream
      # NOTE: upstream's profile-runner action is intentionally not reused:
      # it reads scripts/ci/go/go.mod relative to the calling repo, which
      # breaks cross-checkout, and runner hardware profiling is irrelevant
      # to torture. setup-llvm is path-clean and safe to reuse.
      - uses: ./upstream/.github/actions/setup-llvm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: upstream/rust
          save-if: "true"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: cargo build --release --locked
        working-directory: upstream/rust
      # The AOT link needs the clj-rt static archive next to the binary
      # (same layout as an installed clojure-rs).
      - run: |
          cargo build --release --locked -p clj-rt
          ls target/release/clojure-rs* target/release/libcljrt.a
        working-directory: upstream/rust
      - run: make jars
      - run: >
          make harness &&
          ./harness/target/release/clj-torture run --backend all --diff-backends --strict-xpass
          --jobs 8 --clojure-rs-bin "$GITHUB_WORKSPACE/upstream/rust/target/release/clojure-rs"
      - run: >
          ./harness/target/release/clj-torture fuzz --mode interp --count 200
          --jobs 8 --clojure-rs-bin "$GITHUB_WORKSPACE/upstream/rust/target/release/clojure-rs"
      # AOT fuzz pins 15 known port findings (native heap corruption /
      # nonzero exit; all pass on the JVM oracle). --strict-xpass keeps the
      # gate honest: fixed seeds fail the run until unpinned.
      - run: >
          ./harness/target/release/clj-torture fuzz --mode aot --count 100
          --xfail-seeds 2,10,11,25,31,32,40,42,43,44,54,75,78,93,94 --strict-xpass
          --jobs 8 --clojure-rs-bin "$GITHUB_WORKSPACE/upstream/rust/target/release/clojure-rs"
